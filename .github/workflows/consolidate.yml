name: Validate and consolidate branches

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed main state
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install dependencies with the project installer
        run: bash scripts/install-ci.sh

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test

      - name: Remove the superseded development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/full-parent-planner" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/full-parent-planner"
          else
            echo "Development branch already absent."
          fi
