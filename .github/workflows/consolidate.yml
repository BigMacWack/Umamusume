name: Validate and consolidate branches

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          show-progress: false

      - name: Repair truncated build inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path("app/globals.css")
          css = css_path.read_text(encoding="utf-8")
          stripped = css.rstrip()
          if stripped.endswith("font-weight"):
              css_path.write_text(f"{stripped}: 800;\n}}\n", encoding="utf-8")

          data_path = Path("app/data/uma-data.ts")
          data = data_path.read_text(encoding="utf-8")
          broken = '{"cardId":106401,"cha"charId":1001'
          repaired = '{"cardId":100102,"charId":1001'
          count = data.count(broken)
          if count not in (0, 1):
              raise SystemExit(f"Expected zero or one malformed roster token, found {count}.")
          if count == 1:
              data_path.write_text(data.replace(broken, repaired, 1), encoding="utf-8")
          PY

      - name: Regenerate dependencies and lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### Lint failed"
              echo
              echo '```text'
              tail -100 /tmp/lint.log
              echo '```'
            } > /tmp/lint-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/lint-comment.md
            exit "$status"
          fi
          cat /tmp/lint.log

      - name: Test and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### Test or build failed"
              echo
              echo '```text'
              tail -160 /tmp/test.log
              echo '```'
            } > /tmp/test-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/test-comment.md
            exit "$status"
          fi
          cat /tmp/test.log

      - name: Commit repaired files when needed
        run: |
          if ! git diff --quiet -- package-lock.json app/globals.css app/data/uma-data.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json app/globals.css app/data/uma-data.ts
            git commit -m "Repair build inputs"
            git push origin HEAD:main
          fi

      - name: Remove the superseded development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/full-parent-planner" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/full-parent-planner"
          else
            echo "Development branch already absent."
          fi
