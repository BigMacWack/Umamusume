name: Validate and consolidate branches

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          show-progress: false

      - name: Regenerate dependencies and lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### Lint failed"
              echo
              echo '```text'
              tail -100 /tmp/lint.log
              echo '```'
            } > /tmp/lint-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/lint-comment.md
            exit "$status"
          fi
          cat /tmp/lint.log

      - name: Test and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### Test or build failed"
              echo
              echo '```text'
              tail -120 /tmp/test.log
              echo '```'
            } > /tmp/test-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/test-comment.md
            exit "$status"
          fi
          cat /tmp/test.log

      - name: Commit repaired lockfile when needed
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Repair dependency lockfile"
            git push origin HEAD:main
          fi

      - name: Remove the superseded development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/full-parent-planner" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/full-parent-planner"
          else
            echo "Development branch already absent."
          fi
