name: Validate and consolidate branches

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          show-progress: false

      - name: Report malformed data context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY' > /tmp/data-context.md
          from pathlib import Path

          text = Path("app/data/uma-data.ts").read_text(encoding="utf-8")
          position = 30001
          start = max(0, position - 500)
          end = min(len(text), position + 500)
          print("### Generated-data byte context")
          print()
          print(f"File length: {len(text)} bytes; showing {start}..{end}")
          print()
          print("```text")
          print(repr(text[start:end]))
          print("```")
          PY
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/data-context.md

      - name: Repair the truncated base stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/globals.css")
          text = path.read_text(encoding="utf-8")
          stripped = text.rstrip()
          if stripped.endswith("font-weight"):
              path.write_text(f"{stripped}: 800;\n}}\n", encoding="utf-8")
          PY

      - name: Regenerate dependencies and lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### Lint failed"
              echo
              echo '```text'
              tail -100 /tmp/lint.log
              echo '```'
            } > /tmp/lint-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/lint-comment.md
            exit "$status"
          fi
          cat /tmp/lint.log

      - name: Test and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### Test or build failed"
              echo
              echo '```text'
              tail -160 /tmp/test.log
              echo '```'
            } > /tmp/test-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/test-comment.md
            exit "$status"
          fi
          cat /tmp/test.log

      - name: Commit repaired files when needed
        run: |
          if ! git diff --quiet -- package-lock.json app/globals.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json app/globals.css
            git commit -m "Repair build inputs"
            git push origin HEAD:main
          fi

      - name: Remove the superseded development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/full-parent-planner" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/full-parent-planner"
          else
            echo "Development branch already absent."
          fi
