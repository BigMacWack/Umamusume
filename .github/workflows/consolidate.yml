name: Regenerate data, validate, and consolidate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          show-progress: false

      - name: Repair the truncated base stylesheet
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/globals.css")
          text = path.read_text(encoding="utf-8")
          stripped = text.rstrip()
          if stripped.endswith("font-weight"):
              path.write_text(f"{stripped}: 800;\n}}\n", encoding="utf-8")
          PY

      - name: Download current public GameTora datasets
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          base = "https://gametora.com"
          headers = {"User-Agent": "Mozilla/5.0 (compatible; UmamusumeParentPlanner/1.0)"}
          source = Path("/tmp/uma-source")
          source.mkdir(parents=True, exist_ok=True)

          def fetch_json(url: str):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=90) as response:
                  return json.load(response)

          manifest = fetch_json(f"{base}/data/manifests/umamusume.json")
          datasets = {
              "character-cards": "gt_character_cards.json",
              "characters": "gt_characters.json",
              "en/db-files/succession_relation": "gt_relation.json",
              "en/db-files/succession_relation_member": "gt_relation_member.json",
              "race_instances": "gt_race_instances.json",
          }

          for key, filename in datasets.items():
              digest = manifest.get(key)
              if not digest:
                  raise SystemExit(f"GameTora manifest is missing {key!r}.")
              url = f"{base}/data/umamusume/{key}.{digest}.json"
              payload = fetch_json(url)
              (source / filename).write_text(
                  json.dumps(payload, ensure_ascii=False),
                  encoding="utf-8",
              )
              size = len(payload) if hasattr(payload, "__len__") else "unknown"
              print(f"Downloaded {key}: {size} entries from {url}")
          PY

      - name: Regenerate the Global snapshot
        run: node scripts/generate-uma-data.mjs /tmp/uma-source

      - name: Verify generated snapshot counts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          text = Path("app/data/uma-data.ts").read_text(encoding="utf-8")
          exports = {}
          for line in text.splitlines():
              if not line.startswith("export const ") or " = " not in line:
                  continue
              name, payload = line[len("export const "):].split(" = ", 1)
              suffix = " as const;"
              if payload.endswith(suffix):
                  exports[name] = json.loads(payload[:-len(suffix)])

          expected = {
              "TRAINEE_CARDS": 93,
              "CHARACTERS": 62,
              "GRADED_RACES": 214,
          }
          for name, count in expected.items():
              actual = len(exports.get(name, []))
              if actual != count:
                  raise SystemExit(f"Expected {count} {name}, generated {actual}.")

          if len(exports.get("AFFINITY_GROUPS", [])) < 1:
              raise SystemExit("No compatibility groups were generated.")
          print({name: len(value) for name, value in exports.items() if isinstance(value, list)})
          PY

      - name: Regenerate dependencies and lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run lint, build, and tests
        run: |
          npm run lint
          npm run build
          node --test tests/rendered-html.test.mjs
          npm run test:logic

      - name: Commit regenerated files
        run: |
          if ! git diff --quiet -- package-lock.json app/globals.css app/data/uma-data.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json app/globals.css app/data/uma-data.ts
            git commit -m "Regenerate complete Global data snapshot"
            git push origin HEAD:main
          fi

      - name: Remove the superseded development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/full-parent-planner" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/full-parent-planner"
          else
            echo "Development branch already absent."
          fi
