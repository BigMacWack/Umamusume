name: Validate and consolidate branches

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          show-progress: false

      - name: Repair and validate truncated build inputs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          css_path = Path("app/globals.css")
          css = css_path.read_text(encoding="utf-8")
          stripped = css.rstrip()
          if stripped.endswith("font-weight"):
              css_path.write_text(f"{stripped}: 800;\n}}\n", encoding="utf-8")

          data_path = Path("app/data/uma-data.ts")
          data = data_path.read_text(encoding="utf-8")
          broken_start = '},{"cardId":106401'
          special_name = ',"name":"Special Week","outfit":"Hopping ♪ Vitamin Heart"'
          start = data.find(broken_start)
          end = data.find(special_name, start if start >= 0 else 0)
          if start >= 0:
              if end < 0:
                  raise SystemExit("Found the malformed card prefix but not the Special Week boundary.")
              correct_header = '},{"cardId":100102,"charId":1001'
              data = data[:start] + correct_header + data[end:]
              data_path.write_text(data, encoding="utf-8")

          if '"cha"charId"' in data or '"cha"charId' in data:
              raise SystemExit("Malformed roster token remains after repair.")

          for line in data.splitlines():
              if not line.startswith("export const ") or " = " not in line or not line.endswith(" as const;"):
                  continue
              name, payload = line[len("export const "):].split(" = ", 1)
              try:
                  json.loads(payload[:-len(" as const;")])
              except json.JSONDecodeError as error:
                  position = error.pos
                  context = payload[max(0, position - 180):position + 180]
                  raise SystemExit(f"Generated array {name} is invalid at {position}: {context!r}") from error
          PY

      - name: Regenerate dependencies and lockfile
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run lint > /tmp/lint.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### Lint failed"
              echo
              echo '```text'
              tail -100 /tmp/lint.log
              echo '```'
            } > /tmp/lint-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/lint-comment.md
            exit "$status"
          fi
          cat /tmp/lint.log

      - name: Test and build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm test > /tmp/test.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### Test or build failed"
              echo
              echo '```text'
              tail -160 /tmp/test.log
              echo '```'
            } > /tmp/test-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/test-comment.md
            exit "$status"
          fi
          cat /tmp/test.log

      - name: Commit repaired files when needed
        run: |
          if ! git diff --quiet -- package-lock.json app/globals.css app/data/uma-data.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json app/globals.css app/data/uma-data.ts
            git commit -m "Repair build inputs"
            git push origin HEAD:main
          fi

      - name: Remove the superseded development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/full-parent-planner" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/full-parent-planner"
          else
            echo "Development branch already absent."
          fi
