name: Validate and consolidate branches

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed main state
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install dependencies with the project installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/install-ci.sh > /tmp/install.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo "### Dependency installation failed"
              echo
              echo '```text'
              tail -60 /tmp/install.log
              echo '```'
            } > /tmp/install-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/install-comment.md
            exit "$status"
          fi
          cat /tmp/install.log

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test

      - name: Remove the superseded development branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/agent/full-parent-planner" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/full-parent-planner"
          else
            echo "Development branch already absent."
          fi
