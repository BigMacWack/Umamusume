name: Verify live GitHub Pages site

on:
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: write

jobs:
  verify:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check deployed site
        id: live
        run: |
          url="https://bigmacwack.github.io/Umamusume/"
          status="000"
          for attempt in $(seq 1 18); do
            status=$(curl -L -sS -o /tmp/pages.html -w '%{http_code}' "$url" || true)
            if [ "$status" = "200" ] && grep -q 'Umamusume Parent Planner' /tmp/pages.html; then
              echo "status=$status" >> "$GITHUB_OUTPUT"
              echo "content=success" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "content=failure" >> "$GITHUB_OUTPUT"

      - name: Record live result
        if: always()
        run: |
          cat > pages-live.txt <<EOF
          deployment: ${{ github.event.workflow_run.conclusion }}
          http_status: ${{ steps.live.outputs.status }}
          content: ${{ steps.live.outputs.content }}
          deployment_commit: ${{ github.event.workflow_run.head_sha }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-live.txt
          git commit -m "Record live Pages verification"
          git push origin HEAD:main
