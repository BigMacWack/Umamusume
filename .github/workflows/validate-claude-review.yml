name: Validate Claude review fixes

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-claude-review.yml"
      - "tests/planner-logic.test.ts"
      - "tests/rendered-html.test.mjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        id: install
        continue-on-error: true
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint
      - name: Test
        id: test
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test
      - name: Pages export
        id: pages
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_PAGES: "true"
        run: npm run build:pages
      - name: Verify export
        id: verify
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        run: |
          test -f out/index.html
          grep -q '/Umamusume/_next/' out/index.html
          grep -q 'Umamusume Parent Planner' out/index.html
          if grep -q 'meta-codex-preview' out/index.html; then
            echo 'Debug metadata is still present.' >&2
            exit 1
          fi
      - name: Record result
        if: always()
        run: |
          cat > claude-review-validation.txt <<EOF
          install: ${{ steps.install.outcome }}
          lint: ${{ steps.lint.outcome }}
          test: ${{ steps.test.outcome }}
          pages: ${{ steps.pages.outcome }}
          export: ${{ steps.verify.outcome }}
          commit: ${{ github.sha }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude-review-validation.txt
          git commit -m "Record Claude review validation result"
          git push origin HEAD:main
