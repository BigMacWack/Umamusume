name: Validate GitHub Pages configuration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/validate-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Pages configuration
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint

      - name: Build static Pages export
        id: build
        if: steps.install.outcome == 'success'
        env:
          GITHUB_PAGES: "true"
        run: |
          set +e
          npm run build:pages > /tmp/pages-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify exported paths
        id: verify
        if: steps.build.outputs.status == '0'
        continue-on-error: true
        run: |
          test -f out/index.html
          grep -q '/Umamusume/_next/' out/index.html
          grep -q '/Umamusume/favicon.svg' out/index.html

      - name: Record validation result
        if: always()
        run: |
          {
            echo "pages: ${{ steps.pages.outcome }}"
            echo "install: ${{ steps.install.outcome }}"
            echo "lint: ${{ steps.lint.outcome }}"
            echo "build_status: ${{ steps.build.outputs.status }}"
            echo "paths: ${{ steps.verify.outcome }}"
            echo "commit: ${{ github.sha }}"
            echo
            echo "--- build log tail ---"
            if [ -f /tmp/pages-build.log ]; then
              tail -120 /tmp/pages-build.log
            else
              echo "Build log was not created."
            fi
          } > pages-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages-validation.txt
          git commit -m "Record Pages validation result"
          git push origin HEAD:main
