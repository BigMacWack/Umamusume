name: Validate planner upgrades

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-upgrades.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install dependencies
        id: install
        continue-on-error: true
        run: npm install --ignore-scripts --no-audit --no-fund > /tmp/install.log 2>&1
      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run lint > /tmp/lint.log 2>&1
      - name: Build and test
        id: test
        if: steps.install.outcome == 'success' && steps.lint.outcome == 'success'
        continue-on-error: true
        run: npm test > /tmp/test.log 2>&1
      - name: Commit validation result
        if: always()
        run: |
          status="pass"
          if [ "${{ steps.install.outcome }}" != "success" ] || [ "${{ steps.lint.outcome }}" != "success" ] || [ "${{ steps.test.outcome }}" != "success" ]; then
            status="fail"
          fi
          {
            echo "status: ${status}"
            echo "commit: ${GITHUB_SHA}"
            echo "install: ${{ steps.install.outcome }}"
            echo "lint: ${{ steps.lint.outcome }}"
            echo "test: ${{ steps.test.outcome }}"
            echo
            echo "--- install tail ---"
            tail -40 /tmp/install.log 2>/dev/null || true
            echo
            echo "--- lint tail ---"
            tail -80 /tmp/lint.log 2>/dev/null || true
            echo
            echo "--- test tail ---"
            tail -120 /tmp/test.log 2>/dev/null || true
          } > .planner-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .planner-validation.txt
          git commit -m "Record planner upgrade validation: ${status}" || true
          git push origin HEAD:main

# validation rerun after calendar lint fix
