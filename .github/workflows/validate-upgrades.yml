name: Validate planner upgrades

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-upgrades.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Build and test
        run: npm test
